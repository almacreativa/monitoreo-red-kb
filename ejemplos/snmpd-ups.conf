# Agente SNMP dedicado a la UPS (equipo propio en LibreNMS). Ver docs/04-energia-ups-nut.md
agentaddress udp:1161
view upsview included .1.3.6.1.2.1.1            # system
view upsview included .1.3.6.1.4.1.8072.1.3     # NET-SNMP-EXTEND-MIB
rocommunity <COMMUNITY> <SUBNET_DOCKER> -V upsview
sysname UPS-01
sysdescr <modelo> via NUT (nutdrv_qx)
syslocation <sitio>
syscontact operador
extend ups-nut /etc/snmp/ups-nut.sh ups1
